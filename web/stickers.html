<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIP 3.0 角色表情包 · 9 张</title>
<style>
:root{
  --bg:#faf8f4; --card:#ffffff; --tx:#1f2328; --tx2:#5b6570; --tx3:#66717d;
  --line:#e3e6ea; --line2:#eef0f3; --ac:#1f5fa8; --acbg:#eaf1fb;
  --warn:#a8620d; --warnbg:#fdf3e3; --r:14px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,
 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.7}
.wrap{max-width:880px;margin:0 auto;padding:24px 16px 60px}
h1{font-family:"Yuanti SC","YouYuan","PingFang SC","Microsoft YaHei",sans-serif;font-size:28px;font-weight:400;margin:0 0 6px;line-height:1.3}
.sub{color:var(--tx2);font-size:14px;margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.item{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:center;
 animation:rise .35s ease both;box-shadow:0 4px 16px rgba(78,62,38,.05)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.item svg{width:100%;height:auto;display:block;border-radius:12px}
.item .nm{font-size:14px;font-weight:650;margin:10px 0 2px}
.item .ln{font-size:12px;color:var(--tx2);margin:0 0 10px;min-height:20px}
.item button{border:1px solid var(--line);background:#f6f2ea;color:var(--ac);border-radius:10px;
 padding:7px 14px;font-size:13px;font-family:inherit;cursor:pointer;transition:transform .24s ease,background .18s}
.item button:hover{transform:translateY(-2px);background:#efe9dd}
.item:nth-child(2){animation-delay:.04s}.item:nth-child(3){animation-delay:.08s}
.item:nth-child(4){animation-delay:.12s}.item:nth-child(5){animation-delay:.16s}
.item:nth-child(6){animation-delay:.2s}.item:nth-child(7){animation-delay:.24s}
.item:nth-child(8){animation-delay:.28s}.item:nth-child(9){animation-delay:.32s}
.foot{font-size:12px;color:#66717d;line-height:1.8;margin-top:24px;text-align:center}
.foot a{color:var(--ac);text-decoration:none}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.back{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--tx2);
  background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 15px;font-size:15px;
  line-height:1;margin:0 0 18px;transition:transform .24s ease,border-color .24s ease,color .24s ease}
.back:hover{transform:translateX(-2px);border-color:var(--ac);color:var(--ac)}
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="showcase.html">← 三个入口</a>
<h1>角色表情包 · 9 张</h1>
<p class="sub">每张点「下载 PNG」就能存进微信。全是官方目录里真实存在的角色和数字，纯娱乐，不是医疗建议。</p>
<div class="grid" id="grid"></div>
<p class="foot">
数据源：国家医保局《按病种分值（DIP）付费 3.0 版分组方案》公开附件（2026-09-09）<br>
独立研究实现，与发布机构无隶属关系，未获任何官方认证；不含真实病案，不构成结算或支付意见。<br>
<a href="https://github.com/Meekoriela/cn-dip3-rule-baseline">GitHub</a> ·
<a href="https://meekoriela.github.io/cn-dip3-rule-baseline/">在线核对</a>
</p>
</div>

<script>
var CARDS=[
 {t:'病案先生',n:'主角 · 一份会紧张的病案',c:'#6b7fb5',l1:'我怕被',l2:'归错组',num:'10 张表 / 14154 行',eye:'dot',mouth:'worry'},
 {t:'新人小编',n:'医保办入职第一天',c:'#4f9e8c',l1:'10 张表…',l2:'14154 行…',num:'这还只是目录',eye:'wide',mouth:'flat'},
 {t:'XQ 考官',n:'先期分组 · 19',c:'#e0645c',l1:'19 个名额',l2:'我先说',num:'第一个开口',eye:'sharp',mouth:'smug'},
 {t:'FZ 考官',n:'诊断辅助细分 · 113',c:'#8a63d2',l1:'细节，',l2:'全是细节',num:'还有区间码',eye:'mono',mouth:'flat'},
 {t:'BX 考官',n:'并项规则 · 1725',c:'#2f8f83',l1:'一个诊断',l2:'好几个操作',num:'1829 个多编码格',eye:'dot',mouth:'grin'},
 {t:'JC 考官',n:'基础规则 · 3268',c:'#3d6fc4',l1:'活最多',l2:'话最少',num:'占 63.8%',eye:'dot',mouth:'flat'},
 {t:'否决官',n:'排除表 · 8853 行',c:'#7a8494',l1:'这行',l2:'不纳入分组',num:'占有效行 62.6%',eye:'sharp',mouth:'flat'},
 {t:'9520 老哥',n:'2.0 时代老员工',c:'#d08a3e',l1:'我被',l2:'优化了',num:'9520 → 5125',eye:'dot',mouth:'worry'},
 {t:'所有诊断',n:'彩蛋 · 全表仅 15 条',c:'#b06aa8',l1:'不限专业',l2:'谁也说不清',num:'说明文字，不是编码',eye:'wide',mouth:'grin'}
];
function face(kind){
  if(kind==='wide')return '<circle cx="112" cy="118" r="8" fill="#fff"/><circle cx="188" cy="118" r="8" fill="#fff"/><circle cx="112" cy="118" r="3.5" fill="#2b3345"/><circle cx="188" cy="118" r="3.5" fill="#2b3345"/>';
  if(kind==='sharp')return '<path d="M98 116 L126 112" stroke="#fff" stroke-width="7" stroke-linecap="round"/><path d="M174 112 L202 116" stroke="#fff" stroke-width="7" stroke-linecap="round"/>';
  if(kind==='mono')return '<rect x="98" y="112" width="30" height="8" rx="4" fill="#fff"/><rect x="172" y="112" width="30" height="8" rx="4" fill="#fff"/>';
  return '<circle cx="112" cy="118" r="6" fill="#fff"/><circle cx="188" cy="118" r="6" fill="#fff"/>';
}
function mouthOf(kind){
  if(kind==='grin')return '<path d="M118 152 Q150 180 182 152" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>';
  if(kind==='worry')return '<path d="M120 162 Q150 142 180 162" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>';
  if(kind==='smug')return '<path d="M120 158 Q150 170 180 150" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>';
  return '<path d="M124 158 L176 158" stroke="#fff" stroke-width="7" stroke-linecap="round"/>';
}
function svgOf(d){
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" font-family="Microsoft YaHei, PingFang SC, sans-serif">'+
  '<rect width="300" height="300" rx="26" fill="#fdfcf9"/>'+
  '<rect x="14" y="14" width="272" height="196" rx="20" fill="'+d.c+'"/>'+
  '<ellipse cx="150" cy="140" rx="72" ry="66" fill="#ffffff" fill-opacity=".16"/>'+
  '<circle cx="150" cy="112" r="58" fill="#ffffff" fill-opacity=".94"/>'+
  face(d.eye)+mouthOf(d.mouth)+
  '<text x="150" y="60" font-size="20" font-weight="700" fill="#fff" text-anchor="middle" opacity=".92">'+d.t+'</text>'+
  '<text x="24" y="246" font-size="27" font-weight="800" fill="#1f2328">'+d.l1+'</text>'+
  '<text x="24" y="278" font-size="27" font-weight="800" fill="'+d.c+'">'+d.l2+'</text>'+
  '<text x="286" y="278" font-size="12" fill="#66717d" text-anchor="end">'+d.num+'</text>'+
  '<text x="150" y="296" font-size="10" fill="#a6aebd" text-anchor="middle">数据源：国家医保局 DIP 3.0 · 独立研究实现</text>'+
  '</svg>';
}
var grid=document.getElementById('grid');
CARDS.forEach(function(d,i){
  var div=document.createElement('div');div.className='item';
  div.innerHTML=svgOf(d)+'<p class="nm">'+d.t+'</p><p class="ln">'+d.n+'</p>'+
    '<button data-i="'+i+'">下载 PNG</button>';
  grid.appendChild(div);
});
grid.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  var d=CARDS[+b.getAttribute('data-i')];
  var blob=new Blob([svgOf(d)],{type:'image/svg+xml;charset=utf-8'});
  var url=URL.createObjectURL(blob),img=new Image();
  img.onload=function(){
    var c=document.createElement('canvas');c.width=600;c.height=600;
    c.getContext('2d').drawImage(img,0,0,600,600);
    URL.revokeObjectURL(url);
    var a=document.createElement('a');a.download='DIP表情-'+d.t+'.png';
    a.href=c.toDataURL('image/png');a.click();
  };
  img.onerror=function(){URL.revokeObjectURL(url);alert('生成失败，请换 Chrome / Edge 打开');};
  img.src=url;
});
</script>
</body>
</html>
